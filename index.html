<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ضرب عدد من ثلاثة أرقام في عدد من رقم واحد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--sea1:#2bb8e8;--sea2:#0a6fae;--sand:#f6d98b;--gold:#ffc83d;--wood:#6e4322;--wood2:#3f2411;--ink:#3a2210;--surface:#fff8e6;--text:#3a2210;--field:#fff;--line:#d9b36a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:#2a1d10;--text:#fbe9c0;--field:#3b2a17;--line:#7a5a2c}}
:root[data-theme="dark"]{--surface:#2a1d10;--text:#fbe9c0;--field:#3b2a17;--line:#7a5a2c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Tajawal',Tahoma,sans-serif;overflow:hidden;color:var(--ink);background:linear-gradient(#5f93c4 0%,#9cc3e0 26%,#d9e5ea 37%,#b8cdd3 38.5%,#2e7d92 40%,#1f6280 62%,#0e3b52 100%)}
.app{height:100%;display:flex;flex-direction:column;position:relative}
.sun{position:absolute;top:4%;left:8%;width:min(8vw,80px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fffdf0 30%,#fff3c4 60%,#fff3c400 72%);box-shadow:0 0 90px 40px #fff3c488}
.cloud{position:absolute;height:6%;border-radius:50%;background:radial-gradient(ellipse,#ffffffdd 20%,#ffffff00 70%);filter:blur(6px);pointer-events:none}
.pal{position:absolute;width:0;height:0}
.wave{position:absolute;left:0;right:0;bottom:0;height:62%;background:radial-gradient(ellipse at 30% 0%,#ffffff40,transparent 40%),repeating-linear-gradient(180deg,transparent 0 14px,#ffffff10 15px 17px,transparent 18px 34px);pointer-events:none}
.island{position:absolute;bottom:0;width:min(32vw,380px);height:min(10vw,110px);background:radial-gradient(ellipse at 50% 100%,#cdb184 0 58%,#b39566 59% 60%,transparent 61%);filter:drop-shadow(0 4px 6px #0006);pointer-events:none}
.island span{position:absolute;bottom:50%;width:min(13vw,140px);line-height:0}.island span svg{width:100%;height:auto;display:block}
.isl1{left:-2%}.isl1 span:nth-child(1){left:20%}.isl1 span:nth-child(2){left:48%;width:min(8vw,90px)}
.isl2{right:-2%}.isl2 span:nth-child(1){right:25%}
.sym{position:absolute;font-family:'Lalezar';color:#fff;opacity:.14;pointer-events:none;animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateY(-18px) rotate(10deg)}}
header{position:relative;z-index:5;text-align:center;padding:clamp(8px,2vh,20px) 12px 0}
h1{font-family:'Tajawal',Tahoma,sans-serif;font-weight:800;margin:0;font-size:clamp(22px,4.6vw,54px);line-height:1.25;color:#fff;
text-shadow:0 2px 3px #0008,0 6px 22px #000a}
.sub{margin:.2em 0 0;color:#fff;font-weight:700;font-size:clamp(13px,1.8vw,20px);text-shadow:0 2px 4px #0006}
.bar{position:relative;z-index:6;display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;padding:10px 12px}
.btn{font-family:inherit;font-weight:800;font-size:clamp(14px,1.9vw,22px);border:0;cursor:pointer;color:#4a2606;padding:.55em 1.3em;border-radius:999px;
background:linear-gradient(#ffe27a,#ffb71f);box-shadow:0 5px 0 #b87408,0 9px 14px #0005;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b87408}
.btn.go{background:linear-gradient(#7ff08a,#2fbf45);box-shadow:0 5px 0 #1b7a2b,0 9px 14px #0005;color:#073d12}
.btn.alt{background:linear-gradient(#fff,#cfe9f7);box-shadow:0 5px 0 #6c9db8,0 9px 14px #0005;color:#0a3f5e}
.btn:disabled{filter:grayscale(.8);opacity:.6;cursor:not-allowed}
.btn:focus-visible,.chest:focus-visible{outline:4px solid #fff;outline-offset:3px}
.count{background:#0a3f5ecc;color:#fff;font-weight:800;border-radius:999px;padding:.35em 1em;font-size:clamp(13px,1.6vw,19px)}
#stage{position:relative;flex:1;z-index:4;margin:0 2vw 2vh;min-height:0}
.chest{position:absolute;left:0;top:0;border:0;background:none;padding:0;cursor:pointer;perspective:700px;
transition:transform .42s cubic-bezier(.5,.1,.2,1),opacity .6s;will-change:transform;-webkit-tap-highlight-color:transparent}
.chest.wait{cursor:default}
.chest.ready:hover .bx{filter:brightness(1.12)}
.bx{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .3s}
.chest.ready:hover .bx{transform:translateY(-6%) rotateX(8deg)}
.base{position:absolute;left:6%;right:6%;top:46%;bottom:6%;border-radius:.4em .4em .9em .9em;
background:repeating-linear-gradient(90deg,#00000014 0 2px,transparent 2px 22%),linear-gradient(#7d4f2a,var(--wood) 40%,var(--wood2));
box-shadow:inset 0 .5em .6em #0006,0 1em 1.2em #0006;border:.18em solid #5a300e}
.base::before,.base::after{content:"";position:absolute;top:0;bottom:0;width:13%;background:linear-gradient(90deg,#8a6a28,#d1ae58,#8a6a28);border-inline:.1em solid #3a2a0c}
.base::before{left:10%}.base::after{right:10%}
.lock{position:absolute;left:50%;top:-14%;width:20%;height:34%;transform:translateX(-50%);background:linear-gradient(#e0c070,#9a7428);border:.14em solid #3a2a0c;border-radius:.35em;z-index:3;display:grid;place-items:center}
.lock::after{content:"";width:28%;height:38%;background:#4a2606;border-radius:50% 50% 30% 30%}
.inner{position:absolute;left:10%;right:10%;top:44%;height:8%;border-radius:50%;background:radial-gradient(#fff6b0,#ffc83d 55%,#7a4a08);opacity:0;transition:opacity .4s .2s;z-index:1}
.lid{position:absolute;left:4%;right:4%;top:14%;height:34%;transform-origin:50% 100%;transition:transform .9s cubic-bezier(.3,1.4,.5,1);z-index:2;transform-style:preserve-3d;
border-radius:1.6em 1.6em .2em .2em;background:repeating-linear-gradient(90deg,#00000014 0 2px,transparent 2px 22%),linear-gradient(#85562f,var(--wood));border:.18em solid #5a300e;box-shadow:inset 0 .4em .5em #ffffff40}
.lid::before,.lid::after{content:"";position:absolute;top:0;bottom:0;width:13%;background:linear-gradient(90deg,#8a6a28,#d1ae58,#8a6a28);border-inline:.1em solid #3a2a0c;border-radius:inherit}
.lid::before{left:12%}.lid::after{right:12%}
.star{position:absolute;inset:0;display:grid;place-items:center;font-size:1.4em;z-index:4;pointer-events:none;color:#c9a54e;opacity:.8;text-shadow:0 .06em .1em #2a1808;top:-12%}
.chest.open{z-index:30;opacity:1}
.chest.open .lid{transform:rotateX(-115deg)}
.chest.open .inner{opacity:1}
.chest.open .base{box-shadow:inset 0 .5em .6em #0006,0 0 3em 1.2em #ffd23dcc}
.chest.gone{opacity:0;pointer-events:none}
#shade{position:fixed;inset:0;background:radial-gradient(#0000,#0008);opacity:0;pointer-events:none;transition:opacity .5s;z-index:20}
#shade.on{opacity:1}
#nameTag{position:fixed;left:50%;top:18%;z-index:40;transform:translate(-50%,40px) scale(.4);opacity:0;pointer-events:none;text-align:center;
font-family:'Tajawal',Tahoma,sans-serif;font-weight:800;font-size:clamp(48px,11vw,150px);line-height:1.15;color:#fff6b8;max-width:94vw;
text-shadow:0 3px 0 #c2800a,0 6px 0 #8a4f06,0 12px 22px #000a,0 0 40px #ffd23d;transition:transform .8s cubic-bezier(.2,1.5,.4,1),opacity .5s}
#nameTag.on{opacity:1;transform:translate(-50%,0) scale(1)}
.spark{position:fixed;z-index:35;pointer-events:none;font-size:clamp(20px,3vw,34px);animation:fly 1.6s ease-out forwards}
@keyframes fly{from{opacity:1;transform:translate(0,0) scale(.5)}to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.4) rotate(200deg)}}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;font-weight:800;font-size:clamp(18px,3vw,34px);text-shadow:0 2px 6px #0007;padding:20px;pointer-events:none}
dialog{border:.2em solid var(--line);border-radius:22px;background:var(--surface);color:var(--text);width:min(640px,94vw);max-height:90vh;padding:0;font-family:inherit}
dialog::backdrop{background:#0009}
.dh{padding:16px 20px 8px;display:flex;justify-content:space-between;align-items:center}
.dh h2{margin:0;font-family:'Lalezar';font-weight:400;font-size:28px}
.db{padding:0 20px 18px;max-height:calc(90vh - 70px);overflow:auto}
.row{display:flex;gap:8px;margin:6px 0}
.row input,textarea{flex:1;font:inherit;font-size:18px;padding:.5em .7em;border-radius:12px;border:2px solid var(--line);background:var(--field);color:var(--text)}
textarea{width:100%;min-height:110px;resize:vertical}
.x{border:0;border-radius:12px;background:#e2503f;color:#fff;font:inherit;font-weight:800;padding:0 .9em;cursor:pointer}
.mini{font:inherit;font-weight:800;border:0;border-radius:999px;padding:.5em 1.2em;cursor:pointer;background:var(--gold);color:#4a2606}
.hint{font-size:14px;opacity:.8;margin:.4em 0}
h3{margin:14px 0 4px;font-size:18px}
@media (max-width:640px){.island,.sun{display:none}}
@media (prefers-reduced-motion:reduce){.sym{animation:none}}
</style>
</head>
<body>
<div class="app">
  <svg class="pal" aria-hidden="true"><symbol id="palm" viewBox="0 0 100 140"><path d="M52 140C50 100 58 70 48 40" stroke="#6b4a2b" stroke-width="6" fill="none" stroke-linecap="round"/><g fill="#2f6b2f"><path d="M48 40C30 20 10 26 0 42C20 30 34 34 48 40Z"/><path d="M48 40C66 18 88 24 100 42C80 30 64 34 48 40Z"/><path d="M48 40C40 16 52 4 66 0C56 14 52 26 48 40Z"/><path d="M48 40C20 40 8 58 4 72C20 56 34 48 48 40Z"/><path d="M48 40C74 40 90 56 96 72C78 54 62 48 48 40Z"/></g></symbol></svg>
  <div class="cloud" style="top:10%;right:12%;width:26%"></div>
  <div class="cloud" style="top:20%;left:30%;width:20%"></div>
  <div class="sun"></div>
  <div class="sym" style="top:20%;right:6%;font-size:70px">×</div>
  <div class="sym" style="top:44%;left:4%;font-size:60px;animation-delay:-3s">٧</div>
  <div class="sym" style="top:30%;left:20%;font-size:54px;animation-delay:-5s">٣</div>
  <div class="sym" style="top:55%;right:12%;font-size:64px;animation-delay:-2s">×</div>
  <div class="sym" style="top:14%;right:28%;font-size:50px;animation-delay:-6s">٥</div>
  <div class="wave"></div>
  <div class="island isl1"><span><svg viewBox="0 0 100 140"><use href="#palm"/></svg></span><span><svg viewBox="0 0 100 140"><use href="#palm"/></svg></span></div>
  <div class="island isl2"><span><svg viewBox="0 0 100 140"><use href="#palm"/></svg></span></div>

  <header>
    <h1>ضرب عدد من ثلاثة أرقام في عدد من رقم واحد</h1>
    
  </header>
  <div class="bar">
    <button class="btn alt" id="manage">إدارة الأسماء</button>
    <button class="btn go" id="start">ابدئي المغامرة</button>
    <button class="btn alt" id="reset">جولة جديدة</button>
    <span class="count" id="count"></span>
  </div>
  <div id="stage"></div>
</div>
<div id="shade"></div>
<div id="nameTag" aria-live="polite"></div>

<dialog id="dlg">
  <div class="dh"><h2>إدارة الأسماء</h2><button class="mini" id="close">تم ✓</button></div>
  <div class="db">
    <h3>إدخال الأسماء دفعة واحدة</h3>
    <p class="hint">اكتبي كل اسم في سطر مستقل.</p>
    <textarea id="bulk" placeholder="سارة&#10;نورة&#10;لمى"></textarea>
    <button class="mini" id="addBulk">إضافة الأسماء</button>
    <h3>الأسماء الحالية (<span id="n">0</span>)</h3>
    <div id="list"></div>
    <div class="row"><input id="one" placeholder="اسم جديد" maxlength="40"><button class="mini" id="addOne">إضافة</button></div>
    <button class="mini" id="clear" style="background:#e2503f;color:#fff;margin-top:8px">حذف جميع الأسماء</button>
  </div>
</dialog>

<script>
(function(){
const $=s=>document.querySelector(s);
const stage=$('#stage'),KEY='treasure-names-v1';
let names=[],order=[],picked=new Set(),els=new Map(),state='idle',lay={};

// ---- storage
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(v))names=v.filter(Boolean)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(names))}catch(e){}}

// ---- sound
let ac;
function tone(f,d,t='sine',v=.08,delay=0){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+delay;o.type=t;o.frequency.setValueAtTime(f,s);
g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d)}catch(e){}}
const swish=()=>{tone(300+Math.random()*200,.18,'triangle',.05)};
const chime=()=>[660,880,1100,1320].forEach((f,i)=>tone(f,.5,'sine',.09,i*.11));
const thunk=()=>tone(110,.25,'square',.06);

// ---- build chests
function chestEl(){
  const b=document.createElement('button');b.className='chest wait';b.type='button';
  b.innerHTML='<div class="bx"><div class="inner"></div><div class="base"></div><div class="lid"></div><div class="lock"></div><div class="star">★</div></div>';
  return b;
}
function rebuild(){
  stage.innerHTML='';els.clear();picked.clear();
  order=names.map((_,i)=>i);
  order.forEach(i=>{const e=chestEl();e.setAttribute('aria-label','صندوق كنز');e.addEventListener('click',()=>pick(i));stage.appendChild(e);els.set(i,e)});
  layout(true);updateUI();
  if(!names.length){const d=document.createElement('div');d.className='empty';d.id='emp';d.textContent='اضغطي «إدارة الأسماء» لإضافة أسماء الطالبات';stage.appendChild(d)}
}

// ---- layout: choose grid that maximises chest size
function layout(instant){
  const W=stage.clientWidth,H=stage.clientHeight,n=order.length;if(!n)return;
  let best={s:0};
  for(let c=1;c<=n;c++){const r=Math.ceil(n/c),s=Math.min(W/c,H/(r*.86));if(s>best.s)best={s,c,r}}
  const cs=Math.min(best.s*.9,230),cw=best.s,ch=best.s*.86,{c,r}=best;
  const offX=(W-c*cw)/2,offY=(H-r*ch)/2;
  order.forEach((id,k)=>{
    const row=Math.floor(k/c),inRow=row===r-1?n-c*(r-1):c,col=k%c;
    const x=offX+col*cw+(c-inRow)*cw/2+(cw-cs)/2,y=offY+row*ch+(ch-cs*.82)/2;
    const e=els.get(id);if(!e)return;
    e.style.width=cs+'px';e.style.height=cs*.9+'px';e.style.fontSize=cs/9+'px';
    lay[id]={x,y};
    if(!e.classList.contains('open')){if(instant){e.style.transition='none'}
      e.style.transform=`translate(${x}px,${y}px)`;
      if(instant){e.offsetWidth;e.style.transition=''}}
  });
}
window.addEventListener('resize',()=>layout(true));

function updateUI(){
  const left=order.length;
  $('#count').textContent='الصناديق المتبقية: '+left;
  $('#start').disabled=state==='shuffling'||state==='revealing'||!left;
  els.forEach((e,i)=>{e.classList.toggle('ready',state==='ready');e.classList.toggle('wait',state!=='ready')});
  if(!left&&names.length&&!$('#emp')){const d=document.createElement('div');d.className='empty';d.id='emp';d.textContent='🎉 انتهت الجولة! اضغطي «جولة جديدة» للبدء من جديد';stage.appendChild(d)}
}

// ---- true random shuffle (Fisher-Yates with crypto randomness)
function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function fisher(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function shuffleAnim(total,rounds){
  const step=total/rounds;
  for(let k=0;k<rounds;k++){
    const prev=order.slice();let t=0;
    do{fisher(order);t++}while(order.length>1&&order.every((v,i)=>v===prev[i])&&t<5);
    layout();swish();
    els.forEach(e=>{if(!e.classList.contains('open')){
      const m=e.style.transform;e.style.transform=m+` rotate(${rnd(21)-10}deg)`}});
    await sleep(step);
  }
  layout();
}

$('#start').addEventListener('click',async()=>{
  if(state==='shuffling'||state==='revealing'||!order.length)return;
  state='shuffling';updateUI();
  await shuffleAnim(3000,7);
  state='ready';updateUI();thunk();
});

// ---- reveal
async function pick(id){
  if(state!=='ready'||picked.has(id))return;
  state='revealing';picked.add(id);updateUI();
  const e=els.get(id),tag=$('#nameTag'),shade=$('#shade');
  const W=stage.clientWidth,H=stage.clientHeight,cw=e.offsetWidth,chh=e.offsetHeight;
  const sc=Math.min(2.3,(window.innerHeight*.42)/chh,(window.innerWidth*.8)/cw);
  const r=stage.getBoundingClientRect();
  const cx=(window.innerWidth/2)-r.left-cw/2,cy=(window.innerHeight*.62)-r.top-chh/2;
  e.classList.add('open');shade.classList.add('on');
  e.style.transform=`translate(${cx}px,${cy}px) scale(${sc})`;
  await sleep(550);thunk();
  chime();
  tag.textContent=names[id];tag.classList.add('on');
  sparks(window.innerWidth/2,window.innerHeight*.5);
  await sleep(3800);               // name stays visible > 3 seconds
  tag.classList.remove('on');e.classList.add('gone');shade.classList.remove('on');
  await sleep(550);
  e.remove();els.delete(id);
  order=order.filter(x=>x!==id);
  state='shuffling';updateUI();
  layout();
  if(order.length>1){await shuffleAnim(900,2)}else await sleep(450);
  state='ready';updateUI();
}
function sparks(x,y){
  const a=['✨','⭐','💎','🪙','✨'];
  for(let i=0;i<16;i++){const s=document.createElement('div');s.className='spark';s.textContent='';s.style.cssText+='width:8px;height:8px;border-radius:50%;background:radial-gradient(#fff6c0,#e8b73a);box-shadow:0 0 8px #ffd23d;';
    s.style.left=x+'px';s.style.top=y+'px';
    const ang=Math.random()*6.28,d=120+Math.random()*220;
    s.style.setProperty('--dx',Math.cos(ang)*d+'px');s.style.setProperty('--dy',Math.sin(ang)*d-60+'px');
    document.body.appendChild(s);setTimeout(()=>s.remove(),1700)}
}

$('#reset').addEventListener('click',()=>{if(state==='shuffling'||state==='revealing')return;state='idle';rebuild()});

// ---- names dialog
const dlg=$('#dlg');
function renderList(){
  const L=$('#list');L.innerHTML='';
  names.forEach((nm,i)=>{
    const r=document.createElement('div');r.className='row';
    const inp=document.createElement('input');inp.value=nm;inp.maxLength=40;inp.setAttribute('aria-label','اسم الطالبة');
    inp.addEventListener('change',()=>{const v=inp.value.trim();if(v){names[i]=v}else{names.splice(i,1);renderList()}save()});
    const d=document.createElement('button');d.className='x';d.textContent='حذف';
    d.addEventListener('click',()=>{names.splice(i,1);save();renderList()});
    r.append(inp,d);L.appendChild(r)});
  $('#n').textContent=names.length;
}
$('#manage').addEventListener('click',()=>{if(state==='shuffling'||state==='revealing')return;renderList();dlg.showModal()});
$('#close').addEventListener('click',()=>dlg.close());
dlg.addEventListener('close',()=>{save();state='idle';rebuild()});
$('#addBulk').addEventListener('click',()=>{
  const add=$('#bulk').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  names.push(...add);$('#bulk').value='';save();renderList()});
function addOne(){const v=$('#one').value.trim();if(!v)return;names.push(v);$('#one').value='';save();renderList();$('#one').focus()}
$('#addOne').addEventListener('click',addOne);
$('#one').addEventListener('keydown',e=>{if(e.key==='Enter')addOne()});
$('#clear').addEventListener('click',()=>{if(confirm('هل تريدين حذف جميع الأسماء؟')){names=[];save();renderList()}});

load();
if(!names.length){/* start empty: teacher adds names */}
rebuild();
})();
</script>
</body>
</html>
